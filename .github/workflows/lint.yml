name: Lint

# Checks the workflows with jactionlint's strictest profile, including the shell scripts in run: with shellcheck, and
# the release scripts with shellcheck. Renovate waits for this check before it automerges an update.
on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail, so a failing command in a pipeline fails the step.
    shell: bash

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # Checks out the repository.
    env:
      # The linux_amd64 archive of jactionlint, checked against this SHA-256.
      # renovate: datasource=github-release-attachments depName=jdx/jactionlint
      JACTIONLINT_VERSION: v2.3.0
      JACTIONLINT_SHA256: 907e6f6a59e181879f7e6936e19ee2eca1cbc51de134fb85460cfa8d65a71f28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install jactionlint
        run: |
          archive="jactionlint_${JACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/jdx/jactionlint/releases/download/$JACTIONLINT_VERSION/$archive"
          echo "$JACTIONLINT_SHA256  $archive" | sha256sum -c
          mkdir jactionlint
          tar -xzf "$archive" -C jactionlint
          echo "$RUNNER_TEMP/jactionlint" >> "$GITHUB_PATH"

      # jactionlint skips the run: scripts without a word when shellcheck is missing, and it does not read
      # scripts/release. Running shellcheck here fails when it is missing and covers those scripts.
      - name: Lint the scripts
        run: |
          shellcheck --version
          shellcheck --format=gcc scripts/release/*.sh

      - name: Lint the workflows
        run: jactionlint --profile=pedantic --format=github
